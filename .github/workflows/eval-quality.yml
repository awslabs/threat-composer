name: eval-quality

# Runs when the agent changes, plus a periodic run to catch drift we did not cause.
# Deliberately never on pull_request.
#
# Why not pull_request: a fork pull request cannot obtain AWS credentials. GitHub
# gives it a read-only token, withholds repository and environment secrets, and caps
# id-token at "none", so there is no OIDC token to exchange for a role. Approval
# controls whether a run executes, not what it can reach. As a required check it
# would go green for us and be permanently unrunnable for every external
# contributor. Restricting it to same-repo pull requests would instead mean widening
# the OIDC trust policy from refs/heads/main to pull request refs, which is a real
# loosening in exchange for pre-merge coverage of maintainer branches only.
#
# So detection is post-merge. That is the best available here, and it still
# attributes a regression to a single merge commit rather than to a week of them.
#
# Why the path filter: this eval measures the agent, and the browser extension
# package is a fixture, an input rather than the subject. Triggering only on
# threat-composer-ai means the agent is what moves between runs.
#
# The filter is not what holds the fixture still. That is done by the pin in the
# expectations file: a commit, which is checked out below so the eval analyses the
# same bytes on every run whatever has since happened on main, and a content hash,
# which is verified before the CLI is invoked so a mismatch costs nothing. The filter
# decides when to run; the pin decides whether the run means anything.
#
# Why also on a schedule: the dependencies are locked and the fixture is pinned, so
# the significant remaining variable is Bedrock. The default model is hosted and can
# change underneath us, and a push filtered to our own source would never notice.

on:
  push:
    branches: [main]
    paths:
      - 'packages/threat-composer-ai/**'
      # Documentation cannot change agent behaviour, and a run is real inference.
      - '!packages/threat-composer-ai/**/*.md'
      # Changes to the eval itself should exercise the eval.
      - '.github/workflows/eval-quality.yml'
  schedule:
    # Mondays 06:00 UTC. Scheduled runs always use the default branch, which is what
    # the OIDC role's trust policy is scoped to.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      config:
        description: Expectations file
        default: packages/threat-composer-ai/eval/browser-extension.json
      aws-model-id:
        description: Bedrock model id, blank for the CLI default
        default: ''
      allow-quality-failures:
        description: Report quality failures without failing the job
        type: boolean
        default: false

# Least privilege. id-token is required to mint the OIDC token exchanged for the
# AWS role; contents is required to check out. Nothing here writes to the repo.
permissions:
  contents: read
  id-token: write

# One run at a time. Overlapping runs would double the inference bill for no benefit.
#
# Superseded push runs are cancelled, because when several commits land in quick
# succession the only state worth measuring is the latest one, and each run costs
# real tokens. Scheduled and manual runs are never cancelled: they are deliberate,
# and discarding one halfway wastes everything already spent on it.
concurrency:
  group: eval-quality
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # The CLI's own default execution timeout is 2400s and a reference run took
    # 1066s. This is the outer bound, sized so a slow run reports rather than
    # being cut off mid-graph.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # The two diagram nodes render through graphviz. Installed explicitly rather
      # than relying on the runner image, because a missing `dot` would fail those
      # nodes and read as an agent regression rather than a missing binary.
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: threat-composer-eval-quality

      - name: Install threat-composer-ai with the eval extra
        run: uv sync --extra eval
        working-directory: packages/threat-composer-ai

      # The expectations file owns the fixture's path, commit and hash, so they
      # cannot drift apart by being stated in more than one place.
      - name: Resolve the pinned fixture
        id: fixture
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          fixture = json.load(open(os.environ["CONFIG"]))["fixture"]
          print(f"path={fixture['path']}")
          print(f"sha256={fixture['tree_sha256']}")
          print(f"commit={fixture.get('commit') or ''}")
          PY
        env:
          CONFIG: ${{ inputs.config || 'packages/threat-composer-ai/eval/browser-extension.json' }}

      # Fetches the pinned commit so the eval analyses the same bytes on every run,
      # regardless of what has happened to the fixture on main since. This is what
      # keeps the eval working rather than merely detecting that it should not.
      #
      # Skipped while commit is null, in which case the checked-out tree is used and
      # the hash check below is the only thing holding the input still.
      - name: Check out the pinned fixture
        if: steps.fixture.outputs.commit != ''
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.fixture.outputs.commit }}
          path: _pinned-fixture
          sparse-checkout: ${{ steps.fixture.outputs.path }}
          sparse-checkout-cone-mode: false

      - name: Select the fixture to analyse
        id: target
        run: |
          if [ -n "${{ steps.fixture.outputs.commit }}" ]; then
            echo "dir=${{ github.workspace }}/_pinned-fixture/${{ steps.fixture.outputs.path }}" >> "$GITHUB_OUTPUT"
            echo "analysing fixture pinned at ${{ steps.fixture.outputs.commit }}"
          else
            echo "dir=${{ github.workspace }}/${{ steps.fixture.outputs.path }}" >> "$GITHUB_OUTPUT"
            echo "::warning::fixture.commit is null, analysing the checked-out tree. Results stay comparable only while its hash matches the recorded pin."
          fi

      # Fails before spending anything if the role or model access is wrong, which
      # is a far clearer signal than the graph dying part way through.
      - name: Confirm Bedrock is reachable
        run: |
          uv run python -c "
          import boto3
          models = boto3.client('bedrock', region_name='us-west-2').list_foundation_models()
          print(f\"bedrock reachable, {len(models['modelSummaries'])} models visible\")
          "
        working-directory: packages/threat-composer-ai

      # No --aws-region and no --aws-model-id: the CLI runs on its own defaults so
      # that a change to a default is measured rather than bypassed. That is the most
      # likely cause of a quality shift, a new default model above all, and pinning
      # either here would make the eval blind to it. Region reaches the CLI through
      # AWS_REGION, set by configure-aws-credentials above, because credentials and
      # model access are region scoped. The defaults_exercised check asserts all of
      # this from the provenance the CLI records, and reports the model it resolved.
      - name: Run the quality eval
        id: eval
        run: |
          uv run python -m threat_composer_ai.eval.quality \
            --target "${{ steps.target.outputs.dir }}" \
            --config "${{ github.workspace }}/${{ inputs.config || 'packages/threat-composer-ai/eval/browser-extension.json' }}" \
            --output-dir "${{ runner.temp }}/eval-run" \
            ${{ inputs.aws-model-id && format('--aws-model-id {0}', inputs.aws-model-id) || '' }} \
            --json-report "${{ runner.temp }}/eval-report.json" \
            ${{ inputs.allow-quality-failures == true && '--allow-quality-failures' || '' }} \
            | tee "${{ runner.temp }}/eval-output.txt"
          exit "${PIPESTATUS[0]}"
        working-directory: packages/threat-composer-ai

      # Always, because a failed run is when the report and the spans matter most.
      - name: Summarise
        if: always()
        run: |
          {
            echo '## Quality eval'
            echo
            echo '```'
            sed -n '/threat-composer-ai quality eval/,$p' "${{ runner.temp }}/eval-output.txt" 2>/dev/null || echo 'no output captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-quality-run
          # The session tree carries the threat model, the strands graph state and
          # telemetry/spans.jsonl, which together are enough to re-run every
          # assertion offline with --session-dir and no inference cost.
          path: |
            ${{ runner.temp }}/eval-run/
            ${{ runner.temp }}/eval-report.json
            ${{ runner.temp }}/eval-output.txt
          retention-days: 30
