name: build
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
      # Installed directly rather than through corepack. pnpm 10 manages its own
      # version from the packageManager field in the root package.json, so the
      # major here is all that matters and the exact version stays declared in
      # one place. pnpm also recommends against corepack, which puts a Node shim
      # in front of every invocation.
      - run: npm install -g pnpm@10
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: pushd /tmp && git clone --depth 1 https://github.com/awslabs/git-secrets.git && cd ./git-secrets && PREFIX=/tmp/git-secrets make install && popd
      - run: npm install -g typescript
      - run: npm install -g oss-attribution-generator
      - run: pnpm install --frozen-lockfile
      - run: PATH=/tmp/git-secrets/bin:$PATH pnpm build
      # `lint` covers everything in one graph: nx runs the `eslint` target on
      # each TypeScript package and the `lint` target (ruff) on
      # threat-composer-ai, and the root script adds the e2e suite, which is a
      # standalone package rather than a workspace. Ruff had previously never
      # run in CI at all -- only in the pre-commit hook.
      - run: pnpm lint
      # Vite strips types without checking them, so the build alone cannot catch
      # type errors. Without this step the workspace typecheck rotted unnoticed:
      # web-vitals 6 and mdast 4 broke it and nothing failed.
      - run: pnpm typecheck
      # `test` likewise covers both languages: Vitest on the TypeScript packages
      # and pytest on threat-composer-ai, which nx reaches through the test
      # target declared in its project.json.
      - run: pnpm test

  e2e:
    # Playwright functional tests for the web app. Kept as a separate job from
    # build-test: it needs browsers installed and is the only job that exercises
    # the app at runtime, so a failure here should be distinguishable at a glance
    # from a compile or lint failure.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
      - run: npm install -g pnpm@10
      - run: pnpm install --frozen-lockfile
      # The library must be compiled before the app can be served. `copy-assets`
      # is required too, not optional: the library's PNG/GIF and CSS are rsync'd
      # into lib/ and imported from the ESM output, and the suite asserts that
      # images load and the app is styled.
      - run: pnpm --filter @aws/threat-composer run compile
      - run: pnpm --filter @aws/threat-composer run copy-assets
      # The preview suite serves the production bundle from build/website.
      - run: pnpm --filter @aws/threat-composer-app run compile:website
      # e2e is a standalone npm package, not a pnpm workspace, so that the app's
      # Vitest config never picks up these specs.
      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e
      - name: Typecheck e2e specs
        run: npm run typecheck
        working-directory: e2e
      - name: Run dev-server suite
        run: npm test
        working-directory: e2e
      - name: Run production-preview suite
        run: npm run test:preview
        working-directory: e2e
      # The two extension variants. Built here rather than in the step above
      # because they must NOT inherit the GitHub Pages env vars that deploy.yml
      # sets: VITE_ROUTE_BASE_PATH would put a basename on the memory router and
      # VITE_GITHUB_PAGES would turn on a banner, so the artifact under test
      # would not be the one the extensions ship. `env -u` makes that explicit
      # even though these are unset in this job.
      - name: Build extension variants
        run: pnpm e2e:build:variants
      - name: Run build-variant suite
        run: npm run test:variants
        working-directory: e2e
      # The WXT extension, loaded as a real Chromium extension. Depends on the
      # browser-extension variant built above, which wxt copies into .output.
      - name: Build browser extension
        run: pnpm --filter @aws/threat-composer-app-browser-extension run compile
      - name: Run browser-extension suite
        run: npm run test:extension
        working-directory: e2e
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            e2e/playwright-report/
            e2e/playwright-report-preview/
            e2e/playwright-report-variants/
            e2e/playwright-report-extension/
            e2e/test-results/
          retention-days: 7
