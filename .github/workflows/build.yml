name: build
on: [push, pull_request]
# Least privilege for GITHUB_TOKEN, declared at workflow level so it also covers
# any job added later. Both jobs only ever read the repository: they check out,
# install from public registries and clone a public repo. Nothing here writes to
# the repo, and nothing resolves from GitHub Packages, so `contents: read` is
# sufficient. This matches what the token is already granted in practice, so it
# is a guard against the repository default widening rather than a change in
# behaviour. deploy.yml already scopes its jobs this way.
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: pushd /tmp && git clone --depth 1 https://github.com/awslabs/git-secrets.git && cd ./git-secrets && PREFIX=/tmp/git-secrets make install && popd
      - run: npm install -g typescript
      - run: npm install -g yarn
      - run: npm install -g oss-attribution-generator
      - run: npm install -g @aws/pdk
      - run: pdk install --frozen-lockfile
      - run: PATH=/tmp/git-secrets/bin:$PATH pdk run build
      - run: pdk workspaces run eslint
      # threat-composer-ai is an nx project, not a yarn workspace, so the line
      # above does not reach it. Its pytest suite already runs as part of
      # `pdk run build` (threat-composer-ai:build spawns test), but nothing
      # invokes its ruff target, so lint has been enforced only by the
      # pre-commit hook. This gives CI parity with the hook.
      - run: yarn nx run threat-composer-ai:lint

  e2e:
    # Playwright functional tests for the web app. Kept as a separate job from
    # build-test: it needs a browser installed and is the only job that exercises
    # the app at runtime, so a failure here is distinguishable at a glance from a
    # compile or lint failure.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: npm install -g yarn
      - run: yarn install --frozen-lockfile
      # The library must be compiled before the app can be served: the app
      # resolves @aws/threat-composer through its "main": "lib/index.js".
      - run: yarn nx run @aws/threat-composer:compile
      # The asset copy is required, not optional. The library's CSS/PNG/GIF are
      # rsync'd out of src into lib and imported from there, and the suite
      # asserts both that the app is styled and that images load. This mirrors
      # the first step of the package's projen `post-compile` task; the second
      # step of that task is a full Storybook build, which the suite does not
      # need, so it is deliberately not run here.
      - name: Copy library assets into lib
        run: >-
          rsync -ar --prune-empty-dirs --include='*/' --include='*.css'
          --include='*.png' --include='*.gif' --exclude='*' ./src/* ./lib
        working-directory: packages/threat-composer
      # e2e sits outside the yarn workspaces, so that the app's own test runner
      # never picks up these specs. It still uses yarn, to match the rest of the
      # repository, and carries its own yarn.lock.
      - name: Install e2e dependencies
        run: yarn install --frozen-lockfile
        working-directory: e2e
      - name: Typecheck e2e specs
        run: yarn typecheck
        working-directory: e2e
      # BROWSER=none stops react-scripts opening a browser when Playwright boots
      # the dev server through the app's `dev` script.
      - name: Run web app suite
        run: yarn test
        working-directory: e2e
        env:
          BROWSER: none
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
