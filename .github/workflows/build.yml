name: build
on: [push, pull_request]
# Least privilege for GITHUB_TOKEN, declared at workflow level so it also covers
# any job added later. Both jobs only ever read the repository: they check out,
# install from public registries and clone a public repo. Nothing here writes to
# the repo, and nothing resolves from GitHub Packages, so `contents: read` is
# sufficient. This matches what the token is already granted in practice, so it
# is a guard against the repository default widening rather than a change in
# behaviour. deploy.yml already scopes its jobs this way.
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: pushd /tmp && git clone --depth 1 https://github.com/awslabs/git-secrets.git && cd ./git-secrets && PREFIX=/tmp/git-secrets make install && popd
      - run: npm install -g typescript
      - run: npm install -g yarn
      - run: npm install -g oss-attribution-generator
      - run: yarn install --frozen-lockfile
      # `yarn build` runs every project's nx `build` target. Each package's
      # build depends on its eslint and test targets (and ruff/pytest for
      # threat-composer-ai), so lint and tests are part of the build graph
      # rather than separate steps.
      - run: PATH=/tmp/git-secrets/bin:$PATH yarn build

  e2e:
    # Playwright functional tests for the web app. Kept as a separate job from
    # build-test: it needs a browser installed and is the only job that exercises
    # the app at runtime, so a failure here is distinguishable at a glance from a
    # compile or lint failure.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - run: npm install -g yarn
      # e2e is a yarn workspace and an nx project (e2e/project.json), so one
      # install covers it. Browsers are an explicit target rather than a
      # postinstall hook, so a plain `yarn install` does not download Chromium.
      - run: yarn install --frozen-lockfile
      - run: yarn nx run @aws/threat-composer-e2e:install-browsers
      - name: Typecheck e2e specs
        run: yarn nx run @aws/threat-composer-e2e:typecheck
      # The e2e target depends on @aws/threat-composer:copy-assets, which in
      # turn depends on compile, so nx compiles the library and copies its
      # CSS/PNG/GIF into lib before Playwright boots the app's dev server. The
      # suite asserts both that the app is styled and that images load, so the
      # asset copy is required. A full Storybook build is not needed here and
      # is not in this target's dependency chain.
      # BROWSER=none stops react-scripts opening a browser when Playwright boots
      # the dev server through the app's `dev` target.
      - name: Run web app suite
        run: yarn nx run @aws/threat-composer-e2e:e2e
        env:
          BROWSER: none
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
